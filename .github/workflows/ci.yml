name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes back to the repo, so the token gets read access only.
permissions:
  contents: read

# Three people push to main. A newer push makes the older run's result moot, so
# cancel it rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Reads .nvmrc so CI and local development run the same Node major.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
